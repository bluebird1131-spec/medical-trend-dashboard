# 의료계 동향 API — 배포: npx wrangler deploy
name = "medical-trend-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 예약 실행 (UTC): 30분마다 대시보드 갱신, 06:10·13:10 KST 수집 봇
[triggers]
crons = ["*/30 * * * *", "10 21,4 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "medical-trend-db"
database_id = "5fb11e94-1949-49b7-9e2b-eb74c49bcd69"
