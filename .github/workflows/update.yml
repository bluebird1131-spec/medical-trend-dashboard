name: 시트 동기화 및 배포

on:
  schedule:
    # 주 실행은 Cloudflare Worker 예약(30분마다 workflow_dispatch, auto=1). GitHub 예약은 몇 시간씩 밀리거나 빠져서 예비로만 둠
    - cron: '43 * * * *'
  workflow_dispatch:          # Actions 탭에서 "Run workflow"로 즉시 갱신
    inputs:
      brief:
        description: 'AI 브리핑 새로 만들기 (비우면 바뀐 경우에만): daily, weekly, monthly, all'
        required: false
        default: ''
      auto:
        description: '자동 실행 표시 (Worker 예약이 1로 보냄 — 데이터가 그대로면 배포 생략)'
        required: false
        default: ''
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 앞 실행이 데이터를 커밋했어도 최신 상태에서 시작 (push 충돌 방지)

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Gemini Spark 가 시트에 직접 쓰지 못해(보안 정책 차단) 여기서 새 기사를 분석해 시트에 기록
      - name: 새 기사 AI 분석 → 시트 (선별상태·분류·요약·기관·지역)
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
        run: node scripts/classify.mjs || echo "::warning::새 기사 분석이 중간에 멈췄습니다 (다음 실행에서 다시 시도)"

      - name: 구글 시트 → data.json
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
        run: node scripts/fetch-sheet.mjs

      - name: 키워드 TOP 10 (불필요 기사 포함) → keywords.json
        env:
          SHEET_URL: ${{ secrets.SHEET_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/keywords.mjs || echo "::warning::키워드를 만들지 못했습니다 (페이지는 그대로 갱신)"

      - name: 국고사업 공고 접수기간 → deadlines.json
        run: node scripts/fetch-deadlines.mjs || echo "::warning::접수기간을 읽지 못했습니다 (페이지는 그대로 갱신)"

      - name: 오늘 기사 AI 브리핑 → brief.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          BRIEF_FORCE: ${{ inputs.brief }}
        run: node scripts/ai-brief.mjs

      - name: 바뀐 경우 data.json·thumbs.json·brief.json·deadlines.json·keywords.json 커밋 (이력 보관)
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data.json thumbs.json brief.json deadlines.json keywords.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json thumbs.json $(ls brief.json deadlines.json keywords.json 2>/dev/null)
            git commit -m "data: 시트 동기화 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # 실행 중에 코드가 push 된 경우 대비: 최신 main 위에 얹고(데이터 파일은 이번 결과 우선) push
            git pull --rebase -X theirs origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 정기·자동 실행에서 데이터가 그대로면 배포 생략
      - if: steps.commit.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.auto != '1')
        uses: actions/configure-pages@v5

      - if: steps.commit.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.auto != '1')
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - if: steps.commit.outputs.changed == 'true' || (github.event_name != 'schedule' && inputs.auto != '1')
        id: deploy
        uses: actions/deploy-pages@v4
