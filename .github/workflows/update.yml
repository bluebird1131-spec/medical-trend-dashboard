name: 시트 동기화 및 배포

on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 시트 확인
  workflow_dispatch:          # Actions 탭에서 "Run workflow"로 즉시 갱신
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 구글 시트 → data.json
        env:
          SHEET_URL: ${{ vars.SHEET_URL }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
        run: node scripts/fetch-sheet.mjs

      - name: 바뀐 경우 data.json·thumbs.json 커밋 (이력 보관)
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data.json thumbs.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json thumbs.json
            git commit -m "data: 시트 동기화 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 정기 실행에서 데이터가 그대로면 배포 생략
      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deploy
        uses: actions/deploy-pages@v4
