<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>의료계 동향</title>
<link rel="preload" href="assets/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<script src="assets/lucide.min.js"></script>
<style>
  /* 외부 CDN이 막힌 망에서도 보이도록 폰트·아이콘을 사이트에 함께 올림 */
  @font-face {
    font-family: "Pretendard Variable"; font-weight: 45 920; font-style: normal; font-display: swap;
    src: url("assets/PretendardVariable.woff2") format("woff2-variations");
  }

  /* 아이보리 톤 고정 (기기 다크 모드와 관계없이 밝게) + 포인트 색 1개(indigo) */
  :root {
    --background: #f7f4ec; --surface: #fbf9f3; --card: #fffdf8;
    --foreground: #1c1917; --heading: #1c1917; --body: #292524; --soft: #57534e; --muted: #6f6861; --faint: #9a938a;
    --border: #e8e2d4; --border-strong: #d8d0bd; --hover: #f2ede2;
    --primary: #1c1917; --primary-foreground: #fafaf9;
    --accent: #4f46e5; --accent-soft: #eceefb; --on-accent: #ffffff;
    --mark: #fef08a; --overlay: rgba(9, 9, 11, .4); --ring: #a1a1aa;
    --radius: 14px; --tb-h: 64px; --warn: #b45309; --warn-soft: #fdf3dc;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--background); color: var(--foreground);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word;
    -webkit-font-smoothing: antialiased; font-feature-settings: "tnum";
  }
  body.locked { overflow: hidden; }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }
  .dash { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
  .narrow { max-width: 760px; margin: 0 auto; padding: 0 16px; }
  .wide { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  #govIntro { max-width: 1080px; padding: 0 24px; }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

  /* ---------- 주요 기관 바로가기 ---------- */
  .util { background: var(--background); border-bottom: 1px solid var(--border); }
  .util-in { display: flex; align-items: center; gap: 12px; min-height: 46px; }
  .util-label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .util-links { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .util-links::-webkit-scrollbar { display: none; }
  .qlink {
    display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); font-size: 13px; font-weight: 600; color: var(--body);
    text-decoration: none; white-space: nowrap; transition: border-color .15s, color .15s;
  }
  .qlink:hover { border-color: var(--accent); color: var(--accent); }
  .qlink .lucide { width: 13px; height: 13px; color: var(--faint); }
  .qlink:hover .lucide { color: var(--accent); }

  /* 국고사업 탭 안내 */
  .gov-intro {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 14px; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); background: var(--card);
  }
  .gov-intro p { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--soft); }
  .gov-intro p .lucide { color: var(--accent); }
  .gov-intro p b { color: var(--heading); }
  .gov-only { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; color: var(--soft); cursor: pointer; }
  .gov-only input { width: 16px; height: 16px; accent-color: var(--accent); }
  .dl { display: inline-flex; align-items: center; gap: 3px; margin-right: 8px; padding: 1px 7px 1px 5px; border-radius: 4px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
  .dl .lucide { width: 12px; height: 12px; }
  .dl.open { background: #e3f1e7; color: #1f6b3a; }
  .dl.soon { background: #fde7e3; color: #b42318; }
  .dl.plan { background: var(--accent-soft); color: var(--accent); }
  .dl.closed { background: var(--hover); color: var(--muted); }

  /* ---------- 상단 바 + 화면 탭 ---------- */
  .topbar { position: sticky; top: 0; z-index: 30; background: var(--card); border-bottom: 1px solid var(--border); }
  .tb { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; letter-spacing: -0.02em; min-width: 0; }
  .logo-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--primary); color: var(--primary-foreground); flex-shrink: 0; }
  .vtabs { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--hover); }
  .vtabs button {
    display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 18px; border: 0; border-radius: 9px;
    background: transparent; font-size: 15px; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .vtabs button:hover { color: var(--foreground); }
  .vtabs button.on { background: var(--card); color: var(--heading); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  .vtabs button.on .lucide { color: var(--accent); }
  .tb-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px; color: var(--muted); }
  .fb-link {
    display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; margin-left: 6px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); font-size: 13.5px; font-weight: 600; color: var(--body); text-decoration: none; white-space: nowrap;
  }
  .fb-link:hover { border-color: var(--accent); color: var(--accent); }
  .fb-link + .fb-link { margin-left: 0; }
  .r-fb { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 10px; font-size: 13.5px; font-weight: 600; color: var(--muted); text-decoration: none; }
  .r-fb:hover { color: var(--accent); }
  .icon-btn {
    width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 8px;
    border: 1px solid transparent; background: transparent; cursor: pointer; color: var(--soft);
  }
  .icon-btn:hover { background: var(--hover); color: var(--foreground); }
  .icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
  .icon-btn.loading .lucide { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 화면 제목 + 기간 */
  .subbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 28px; padding-bottom: 20px; }
  .subbar h1 { margin: 0; font-size: 26px; line-height: 1.3; font-weight: 800; letter-spacing: -0.03em; color: var(--heading); }
  .subbar p { margin: 4px 0 0; font-size: 14.5px; color: var(--muted); }
  .subbar p b { color: var(--heading); }
  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); flex-shrink: 0; }
  .seg button {
    height: 34px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
    font-size: 14px; font-weight: 500; color: var(--muted);
  }
  .seg button.on { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }

  /* 공통 카드 */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; min-width: 0; }
  .card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .card-head h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 16px; font-weight: 700; color: var(--heading); }
  .card-head h2 .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); }
  .card-head span { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .more-link { display: inline-flex; align-items: center; gap: 2px; margin-top: 10px; padding: 4px 0; border: 0; background: none; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
  .more-link:hover { color: var(--accent); }
  .more-link .lucide { width: 14px; height: 14px; }

  /* 기사 한 줄 (패널·열 공통) */
  .pi { display: block; width: 100%; text-align: left; padding: 10px 0; border: 0; border-top: 1px solid var(--border); background: none; cursor: pointer; }
  .pi:first-child { border-top: 0; padding-top: 2px; }
  .pi-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); margin-bottom: 3px; }
  .pi-rv { padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: 700; line-height: 18px; background: var(--warn-soft); color: var(--warn); }
  .pi-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 15px; line-height: 1.5; font-weight: 650; letter-spacing: -0.01em; color: var(--heading);
  }
  .pi:hover .pi-title { color: var(--accent); }
  .pi.read .pi-title { color: var(--muted); font-weight: 500; }

  /* ---------- 오늘의 브리핑 ---------- */
  .brief { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
  .brief.solo { grid-template-columns: minmax(0, 640px); justify-content: center; }
  .side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .side .card { flex: 1; }
  .panel-count { font-size: 13px; color: var(--muted); }
  .panel-count b { font-size: 15px; color: var(--accent); }
  .cloud-card { display: flex; flex-direction: column; }
  .cloud-note { margin: auto 0 0; padding-top: 12px; font-size: 12.5px; color: var(--muted); }
  .cloud-card .bar-row { grid-template-columns: 110px minmax(0, 1fr) 32px; }

  /* AI 데일리 브리핑 */
  .ai { margin-bottom: 16px; padding: 0; overflow: clip; }  /* hidden 이면 시사점 고정(sticky)이 안 됨 */
  .ai-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .ai-label { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 15px; font-weight: 700; color: var(--heading); }
  .ai-label .ai-mark { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
  .ai-label .ai-mark .lucide { width: 15px; height: 15px; }
  .ai-label small { font-size: 13px; font-weight: 500; color: var(--muted); }
  .ai-tools { display: flex; align-items: center; gap: 8px; }
  .ai-sec + .ai-sec { margin-top: 28px; padding-top: 24px; border-top: 1px dashed var(--border-strong); }
  .ai-sec-name { display: flex; align-items: center; gap: 6px; margin: 0 0 16px; font-size: 14px; font-weight: 800; color: var(--accent); letter-spacing: .02em; }
  .ai-sec-name .lucide { width: 14px; height: 14px; }
  .ai-main { counter-reset: ai; }
  .ai-main .ai-points { counter-reset: none; }
  .ai-nav { display: flex; align-items: center; gap: 2px; font-size: 13px; color: var(--muted); }
  .ai-nav .icon-btn { width: 30px; height: 30px; }
  .ai-body { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(320px, 1fr); }
  .ai-main { padding: 26px 32px 30px; min-width: 0; }
  .ai-headline { margin: 0 0 24px; font-size: 25px; line-height: 1.45; font-weight: 800; letter-spacing: -0.03em; color: var(--heading); text-wrap: balance; }
  .ai-points { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; margin: 0; padding: 0; list-style: none; counter-reset: ai; }
  .ai-points li { counter-increment: ai; position: relative; padding-left: 36px; min-width: 0; }
  .ai-points li::before {
    content: counter(ai); position: absolute; left: 0; top: 1px; width: 24px; height: 24px; border-radius: 7px;
    display: grid; place-items: center; background: var(--primary); color: var(--primary-foreground); font-size: 13px; font-weight: 700;
  }
  .ai-points h3 { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 750; letter-spacing: -0.02em; color: var(--heading); }
  .ai-points p { margin: 6px 0 0; font-size: 15.5px; line-height: 1.75; color: var(--body); }
  .ai-refs { display: grid; gap: 2px; margin-top: 8px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); }
  .ai-ref {
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 8px; width: 100%;
    padding: 6px 8px; border: 0; border-radius: 7px; background: none; text-align: left; cursor: pointer;
  }
  .ai-ref:hover { background: var(--hover); }
  .ai-ref .src { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .ai-ref .t { font-size: 13.5px; line-height: 1.5; font-weight: 600; color: var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-ref:hover .t { color: var(--accent); }
  .ai-ref.extra { display: none; }
  .ai-refs.open .ai-ref.extra { display: grid; }
  .ai-refs.open .ai-more { display: none; }
  .ai-more {
    display: inline-flex; align-items: center; gap: 3px; justify-self: start; margin: 2px 4px 2px; padding: 3px 8px; border: 0; border-radius: 6px;
    background: none; font-size: 12.5px; font-weight: 600; color: var(--accent); cursor: pointer;
  }
  .ai-more:hover { background: var(--accent-soft); }
  .ai-more .lucide { width: 13px; height: 13px; }
  .ai-side { padding: 26px 28px 30px; border-left: 1px solid var(--border); background: var(--surface); min-width: 0; }
  .ai-side-in { position: sticky; top: calc(var(--tb-h) + 20px); }
  .ai-side h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 17px; font-weight: 800; color: var(--heading); }
  .ai-side h3 .lucide { width: 18px; height: 18px; }
  .ai-side h3 .lucide { color: var(--accent); }
  .ai-side ul { margin: 0; padding-left: 1.1em; font-size: 15.5px; line-height: 1.75; color: var(--heading); }
  .ai-side li { margin-bottom: 12px; }
  .ai-side li::marker { color: var(--faint); }
  .ai-note { margin: 16px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
  /* 다른 화면으로 넘어가는 버튼 */
  .ai-go { display: grid; gap: 8px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }
  .ai-go button {
    display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); text-align: left; cursor: pointer; font-size: 15px; font-weight: 700; color: var(--heading);
  }
  .ai-go button:hover { border-color: var(--accent); color: var(--accent); }
  .ai-go button .lucide:first-child { color: var(--accent); }
  .ai-go button span { flex: 1; }
  .ai-go button small { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .go-only { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 8px 0 0; }

  /* ---------- 분류별 보기 ---------- */
  .ccols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  /* 분류별 보기 목록은 제목만: 한 줄에 한 기사, 마우스를 올리면 날짜·출처 */
  .ccol-list .pi { padding: 8px 0; }
  .ccol-list .pi-title { -webkit-line-clamp: 1; font-size: 14.5px; font-weight: 600; }
  .ccol-list .pi-rv { margin-right: 6px; vertical-align: 1px; }
  .ccol { display: flex; flex-direction: column; }
  .ccol-name { display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: none; font-size: 16px; font-weight: 700; color: var(--heading); cursor: pointer; }
  .ccol-name:hover { color: var(--accent); }
  .ccol-name .lucide { width: 15px; height: 15px; color: var(--faint); }
  .ccol-num { margin-top: 6px; font-size: 14px; color: var(--muted); }
  .ccol-num b { font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.03em; color: var(--heading); margin-right: 2px; }
  .share { height: 6px; margin: 10px 0 14px; border-radius: 3px; background: var(--hover); overflow: hidden; }
  .share span { display: block; height: 100%; border-radius: 0 3px 3px 0; background: var(--accent); }
  .ccol-list { max-height: 360px; overflow-y: auto; margin-right: -8px; padding-right: 8px; scrollbar-width: thin; }
  .bottom { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; }

  /* 가로 막대 (키워드·출처) */
  .bar-row {
    display: grid; grid-template-columns: 96px minmax(0, 1fr) 32px; align-items: center; gap: 10px;
    width: 100%; padding: 6px 8px; margin: 0 -8px; border: 0; border-radius: 6px; background: none; cursor: pointer; text-align: left;
  }
  .bar-row:hover { background: var(--hover); }
  .bar-label { font-size: 14px; font-weight: 500; color: var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { display: block; }
  .bar-fill { display: block; height: 8px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--accent); }
  .bar-val { font-size: 13px; color: var(--muted); text-align: right; }

  /* 세로 막대 (일자별) */
  .trend { position: relative; height: 230px; margin-left: 26px; }
  .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--border); }
  .gl span { position: absolute; left: -26px; top: -9px; width: 20px; text-align: right; font-size: 11.5px; color: var(--faint); }
  .tcols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
  .tcol { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; border-radius: 4px; }
  .tcol:hover { background: var(--hover); }
  .tcol span { width: 100%; max-width: 22px; border-radius: 4px 4px 0 0; background: var(--accent); }
  .tx { display: flex; gap: 2px; margin: 6px 0 0 26px; }
  .tx span { flex: 1; text-align: center; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: visible; }

  /* ---------- 전체 기사 ---------- */
  .toolbar { position: sticky; top: var(--tb-h); z-index: 20; background: var(--background); padding: 4px 0 10px; }
  .toolbar.stuck { box-shadow: 0 1px 0 var(--border); }
  .tabs {
    display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
            mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; }
  .tab {
    height: 36px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
    font-size: 14px; font-weight: 600; color: var(--soft); cursor: pointer; white-space: nowrap;
  }
  .tab:hover { border-color: var(--border-strong); color: var(--foreground); }
  .tab .n { margin-left: 5px; font-weight: 500; color: var(--faint); }
  .tab.on { background: var(--primary); border-color: var(--primary); color: var(--primary-foreground); }
  .tab.on .n { color: inherit; opacity: .6; }
  .tool-row { display: flex; gap: 8px; margin-top: 12px; }
  .search { position: relative; display: block; flex: 1; min-width: 0; max-width: 560px; }
  .search .lucide { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input {
    width: 100%; height: 42px; padding: 0 12px 0 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--card); color: var(--foreground); font: inherit; font-size: 15px;
  }
  .search input::placeholder { color: var(--faint); }
  .search input::-webkit-search-cancel-button { display: none; }
  .result { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin-top: 8px; font-size: 14px; color: var(--muted); }
  .result b { color: var(--foreground); }
  .link-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 4px 6px; border-radius: 6px; font-size: 13px; color: var(--soft); cursor: pointer; }
  .link-btn:hover { background: var(--hover); color: var(--foreground); }
  .link-btn .lucide { width: 14px; height: 14px; }
  .day { display: flex; align-items: baseline; gap: 8px; margin: 32px 0 12px; font-size: 15px; font-weight: 700; color: var(--heading); }
  .day .rel { font-size: 13px; font-weight: 700; color: var(--accent); }
  .day .cnt { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--faint); }
  #newsList { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }

  let filter = { q: '', cat: '전체', period: 'today' };  // 처음 열면 '어제~오늘'
  let brief = { days: [] }, briefAt = 0, aiKind = 'daily';
  let view = 'brief', shown = PAGE, ctx = [], current = -1, lastFocus = null, firstLoad = true;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const icon = name => `<i data-lucide="${name}"></i>`;
  const drawIcons = () => { if (window.lucide) lucide.createIcons(); };
  const fmt = n => n.toLocaleString('ko-KR');

  // 읽은 기사 표시 (이 브라우저에만 저장)
  const readSet = (() => { try { return new Set(JSON.parse(localStorage.getItem('mt-read') || '[]')); } catch { return new Set(); } })();
  const markRead = id => {
    readSet.add(id);
    try { localStorage.setItem('mt-read', JSON.stringify([...readSet].slice(-3000))); } catch {}
    document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.add('read'));
  };

  function detect(hs) {
    const c = {};
    hs.forEach((h, i) => {
      for (const [k, re] of Object.entries(RULES)) {
        if (c[k] === undefined && re.test(h)) { c[k] = i; break; }
      }
    });
    // 날짜 열이 수집일 하나뿐이면 그것을 기사 날짜로도 씀
    if (c.date === undefined && c.collected !== undefined) c.date = c.collected;
    if (c.title === undefined) {
      const used = new Set(Object.values(c));
      const i = hs.findIndex((_, i) => !used.has(i));
      if (i >= 0) c.title = i;
    }
    return c;
  }

  // "2026-10-10", "2026. 10. 10.", "2026/10/10 09:00" 등 처리
  function parseDate(s) {
    const m = String(s || '').match(/(\d{4})\D{1,3}(\d{1,2})\D{1,3}(\d{1,2})/);
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  }
  const dayKey = d => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  const shortDate = d => d ? `${d.getMonth() + 1}.${d.getDate()}` : '';
  const today0 = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
  const daysAgo = d => d ? Math.round((today0() - d) / 86400000) : Infinity;
  const get = (r, k) => cols[k] === undefined ? '' : String(r[cols[k]] ?? '').trim();
  const splitList = s => s.split(/[,，#]/).map(x => x.trim()).filter(Boolean);
  const cats = r => splitList(get(r, 'category'));
  const extras = r => {
    const used = new Set(Object.values(cols));
    return headers.map((h, i) => ({ h, v: String(r[i] ?? '').trim() })).filter((e, i) => !used.has(i) && e.h && e.v);
  };
  const hash = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
  const titleOf = it => get(it.r, 'title') || '(제목 없음)';
  // 사진이 깨지면 다음 후보로, 후보가 없으면 지워서 자리 표시가 보이게 함
  window.imgErr = el => { const fb = el.dataset.fb; if (fb) { el.dataset.fb = ''; el.src = fb; } else el.remove(); };
  // NEW: 오늘 수집됐고 보도도 최근 3일 안 (과거분 일괄 수집 기사는 제외)
  const isNew = it => daysAgo(it.collected) === 0 && daysAgo(it.date) <= 2;
  // 요약 맨 앞 "[선별(필요)-공적정책]" 같은 판정 태그는 본문에서 떼어 따로 보여 줌
  const TAG = /^\s*\[([^\]]+)\]\s*/;
  const summaryOf = r => get(r, 'summary').replace(TAG, '');
  const judgeOf = r => { const m = get(r, 'summary').match(TAG); return m ? m[1].replace(/^(선별\(필요\)|검토필요|선별|검토|필요)\s*[-·:]\s*/, '') : ''; };
  // 시트에 이미지 열이 있으면 그것을, 없으면 수집 스크립트가 원문에서 가져온 대표 이미지를 씀
  // 수집 스크립트가 열리는지 확인해 고른 사진(thumbs)을 먼저 쓰고, 확인하지 못한 경우에만 시트 사진을 시도
  // 여러 기사에 똑같이 들어간 시트 사진은 기관 배너로 보고 쓰지 않음
  const imgOf = r => {
    const v = get(r, 'image'), t = thumbs[get(r, 'link')] || '';
    const sheet = /^https?:\/\//i.test(v) && (imgFreq.get(v) || 0) < 3 ? v : '';
    return { src: t || sheet, fb: t && sheet && sheet !== t ? sheet : '' };
  };
  // 화면을 나누는 기준: 분류 열이 있으면 분류, 없으면 출처(기관·매체)
  const groupLabel = () => cols.category !== undefined ? '분류' : '출처';
  // 국고사업 탭: 출처·기관 열 또는 원문 주소가 보건복지부인 자료
  const MOHW = /보건복지부|복지부|mohw\.go\.kr/i;
  const isMohw = r => MOHW.test(get(r, 'source')) || MOHW.test(get(r, 'link')) ||
    headers.some((h, i) => /기관/.test(h) && MOHW.test(String(r[i] ?? '')));
  // 분류값이 "로봇수술/첨단장비"처럼 세분돼 있으면 "/" 앞 큰 분류로 묶음
  const mainCat = c => c.split('/')[0].replace(/\(.*?\)/g, '').trim() || c;
  const groups = r => cols.category !== undefined ? [...new Set(cats(r).map(mainCat))] : (get(r, 'source') ? [get(r, 'source')] : []);
  const TOP = 8, OTHER = '기타';
  // 상위 8개 묶음 + 나머지는 '기타' (고정 분류 9개가 모두 보이게)
  const topNames = list => {
    const m = new Map();
    // 분류값 자체가 '기타'인 기사는 맨 끝 '기타' 묶음으로 (같은 이름 묶음이 두 번 나오지 않게)
    list.forEach(it => groups(it.r).forEach(g => g !== OTHER && m.set(g, (m.get(g) || 0) + 1)));
    const sorted = [...m].sort((a, b) => b[1] - a[1]);
    if (sorted.length <= TOP + 1) return sorted.map(x => x[0]);
    const multi = sorted.filter(x => x[1] >= 2).slice(0, TOP).map(x => x[0]);
    return multi.length ? multi : sorted.slice(0, TOP).map(x => x[0]);
  };
  const inGroup = (it, g, tops) => g === OTHER ? !groups(it.r).some(x => tops.includes(x)) : groups(it.r).includes(g);

  function stripJosa(w) {
    if (!/[가-힣]$/.test(w)) return w;
    for (const j of JOSA) if (w.endsWith(j) && w.length - j.length >= 2) return w.slice(0, -j.length);
    return w;
  }
  function tokens(text) {
    return text.replace(/\[[^\]]*\]|\([^)]*\)/g, ' ')
      .split(/[^0-9A-Za-z가-힣·]+/)
      .map(w => stripJosa(w.replace(/^·+|·+$/g, '')))
      .filter(w => w.length >= 2 && !/^\d/.test(w) && !STOP.has(w) && !VERBISH.test(w) &&
        !(w.length >= 3 && /[한된할될다고]$/.test(w)));
  }
  // 키워드 열이 있으면 그것을, 없으면 제목에서 뽑음 (기사 1건당 1번만 셈)
  function keywordsOf(it) {
    return it.kw || (it.kw = cols.keywords !== undefined && get(it.r, 'keywords')
      ? [...new Set(splitList(get(it.r, 'keywords')))]
      : [...new Set(tokens(titleOf(it)))]);
  }
  function countBy(list, fn) {
    const m = new Map();
    list.forEach(it => fn(it).forEach(k => m.set(k, (m.get(k) || 0) + 1)));
    return [...m].map(([label, n]) => ({ label, n })).sort((a, b) => b.n - a.n || a.label.localeCompare(b.label, 'ko'));
  }

  function hl(s) {
    const t = esc(s);
    return filter.q ? t.replace(new RegExp(escRe(esc(filter.q)), 'gi'), m => `<mark>${m}</mark>`) : t;
  }
  const inline = s => hl(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const plain = s => s.split('\n').map(l => l.replace(BULLET, '').trim()).filter(Boolean).join(' ').replace(/\*\*/g, '');

  // 읽기 패널용: 줄마다 문단, 글머리(-, •, 1.)가 연속되면 목록으로
  function prose(text) {
    const out = [];
    let list = null;
    const flush = () => { if (list) { out.push(`<${list.tag}>${list.items.join('')}</${list.tag}>`); list = null; } };
    text.replace(/\r/g, '').split('\n').forEach(line => {
      if (!line.trim()) { flush(); return; }
      if (BULLET.test(line)) {
        const tag = /^\s*\d/.test(line) ? 'ol' : 'ul';
        if (!list || list.tag !== tag) { flush(); list = { tag, items: [] }; }
        list.items.push(`<li>${inline(line.replace(BULLET, ''))}</li>`);
      } else { flush(); out.push(`<p>${inline(line.trim())}</p>`); }
    });
    flush();
    return out.join('');
  }
  const fullDate = d => d ? `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${WEEK[d.getDay()]}` : '날짜 미상';

  /* ---------- 데이터 ---------- */
  function load() {
    if (location.protocol === 'file:') {
      brief = DEMO_BRIEF;
      onData(DEMO);  // PC에서 파일을 직접 열었을 때 미리보기
      $('notice').innerHTML = `<div class="notice">${icon('info')}<div><b>미리보기 모드</b> · 예시 데이터입니다. GitHub Pages에서는 실제 시트 데이터가 표시됩니다.</div></div>`;
      drawIcons();
      return;
    }
    // data.json 은 GitHub Actions 가 30분마다 구글 시트에서 만들어 둠. 브라우저는 구글에 접속하지 않음.
    // brief.json(AI 브리핑)은 없어도 페이지는 그대로 보임
    fetch('deadlines.json?t=' + Date.now(), { cache: 'no-store' }).then(res => res.ok ? res.json() : {})
      .then(d => { deadlines = d || {}; if (items.length) renderAll(); }).catch(() => {});
    const aiReq = fetch('brief.json?t=' + Date.now(), { cache: 'no-store' })
      .then(res => res.ok ? res.json() : { days: [] }).catch(() => ({ days: [] }));
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(d => aiReq.then(b => { brief = b && typeof b === 'object' ? b : {}; brief.days = Array.isArray(brief.days) ? brief.days : []; briefAt = 0; onData(d); }))
      .catch(onError);
  }

  function onError(e) {
    $('vDesc').textContent = '데이터를 불러오지 못했습니다';
    $('notice').innerHTML = `<div class="notice">${icon('circle-alert')}<div><b>데이터를 불러오지 못했습니다</b> · ${esc(e && e.message || e)} · 잠시 후 새로고침해 주세요.</div></div>`;
    drawIcons();
  }

  function onData(d) {
    headers = d.headers || [];
    cols = detect(headers);
    thumbs = d.thumbs || {};
    // 머리글 이름과 관계없이 '필요/검토필요/불필요'(예전 '선별(필요)/제외(…)') 값이 대부분인 열을 상태 열로 봄
    const rows = d.rows || [];
    const st = headers.findIndex((_, i) => {
      const v = rows.map(r => String(r[i] ?? '').trim()).filter(Boolean);
      return v.length && v.filter(x => /^\[?\s*(필요|불필요|선별|검토|제외)/.test(x)).length / v.length >= 0.5;
    });
    if (st >= 0) { for (const k in cols) if (cols[k] === st) delete cols[k]; cols.status = st; }
    imgFreq = new Map();
    if (cols.image !== undefined) rows.forEach(r => { const v = String(r[cols.image] ?? '').trim(); if (v) imgFreq.set(v, (imgFreq.get(v) || 0) + 1); });
    items = rows.filter(r => !/^\[?\s*(불필요|제외)/.test(get(r, 'status'))).map(r => {
      const date = parseDate(get(r, 'date'));
      const collected = parseDate(get(r, 'collected')) || date;
      return { r, date, collected, id: hash(dayKey(date) + '|' + get(r, 'title')), text: r.join(' ').toLowerCase() };
    });
    items.sort((a, b) => (b.date ? b.date.getTime() : -Infinity) - (a.date ? a.date.getTime() : -Infinity));
    if (d.title) { $('brand').textContent = d.title; document.title = d.title; }
    $('updated').textContent = d.fetchedAt ? `${d.fetchedAt} 업데이트` : '데이터 수집 대기 중';
    // 어제~오늘 기사가 아직 없으면(분석 전 이른 아침 등) 7일 → 전체 순으로 넓혀 보여 줌
    if (firstLoad && items.length && !items.some(inPeriod)) filter.period = '7';
    if (firstLoad && items.length && !items.some(inPeriod)) filter.period = 'all';
    firstLoad = false;
    renderAll();
  }

  function inPeriod(it) {
    if (filter.period === 'all') return true;
    // '어제~오늘': 아침에 전날부터 그날까지의 소식을 함께 공유하는 용도
    const a = daysAgo(it.date), max = filter.period === 'today' ? 1 : +filter.period - 1;
    return a >= 0 && a <= max;
  }
  const periodItems = () => items.filter(inPeriod);

  /* ---------- 공통 조각 ---------- */
  const piTitle = (it, ctxName, i) => {
    const tip = [shortDate(it.date), get(it.r, 'source')].filter(Boolean).join(' · ');
    return `<button type="button" class="pi${readSet.has(it.id) ? ' read' : ''}" data-ctx="${esc(ctxName)}" data-i="${i}" data-id="${it.id}" title="${esc(tip + ' · ' + titleOf(it))}">
      <span class="pi-title">${isReview(it.r) ? '<span class="pi-rv">검토</span>' : ''}${esc(titleOf(it))}</span></button>`;
  };
  const pi = (it, ctxName, i, withCat) => {
    const src = get(it.r, 'source');
    const meta = [shortDate(it.date), withCat ? cats(it.r)[0] : '', src].filter(Boolean).map(esc).join(' · ');
    return `<button type="button" class="pi${readSet.has(it.id) ? ' read' : ''}" data-ctx="${esc(ctxName)}" data-i="${i}" data-id="${it.id}">
      <span class="pi-meta">${isReview(it.r) ? '<span class="pi-rv">검토</span>' : ''}<span>${meta}</span></span><span class="pi-title">${esc(titleOf(it))}</span></button>`;
  };
  const byCategory = list => {
    const tops = topNames(list);
    const out = tops.map(g => [g, list.filter(it => inGroup(it, g, tops))]);
    const rest = list.filter(it => inGroup(it, OTHER, tops));
    if (rest.length && groups(rest[0].r).length) out.push([OTHER, rest]);
    return out.filter(([, arr]) => arr.length);
  };
  const empty = (msg, ic = 'inbox') => `<div class="state sm">${icon(ic)}<div>${msg}</div></div>`;
  const kwBarsHtml = rows => {
    if (!rows.length) return empty('표시할 키워드가 없습니다');
    const max = Math.max(...rows.map(r => r.n));
    return rows.map(r => `<button type="button" class="bar-row" data-q="${esc(r.label)}" data-tip="${esc(r.label)} · 기사 ${r.n}건 · 눌러서 보기">
      <span class="bar-label">${esc(r.label)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${(r.n / max * 100).toFixed(1)}%"></span></span>
      <span class="bar-val">${fmt(r.n)}</span></button>`).join('');
  };
  const isReview = r => /^\[?\s*검토/.test(get(r, 'status'));
  // 접수 상태: 예정 / 접수 중(마감 3일 전부터 '마감 임박') / 마감
  const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  const md = s => `${+s.slice(5, 7)}.${+s.slice(8, 10)}`;
  function dlOf(it) {
    const d = deadlines[get(it.r, 'link')];
    if (!d || !d.end) return null;
    const t = kstToday(), left = Math.round((Date.parse(d.end) - Date.parse(t)) / 864e5);
    if (d.start && d.start > t) return { kind: 'plan', text: `접수 예정 ${md(d.start)}~${md(d.end)}`, open: false };
    if (left < 0) return { kind: 'closed', text: `마감 ${md(d.end)}`, open: false };
    return { kind: left <= 3 ? 'soon' : 'open', text: `접수 중 ~${md(d.end)} · ${left === 0 ? '오늘 마감' : 'D-' + left}`, open: true };
  }
  // 출처별 자리 표시 색 (사진 없는 기사)
  const SRC_COLOR = [[/복지부/, '#e6ecf8', '#33508f', 'landmark'], [/메디컬타임즈/, '#f8e8e3', '#9b3d24', 'newspaper'],
    [/데일리메디/, '#e5f2e8', '#2d6a43', 'newspaper'], [/청년의사/, '#f7eedb', '#8a5a12', 'newspaper']];
  const srcStyle = src => { const m = SRC_COLOR.find(([re]) => re.test(src)); return m ? { css: `--ph-bg:${m[1]};--ph-fg:${m[2]}`, ic: m[3] } : { css: '', ic: 'newspaper' }; };

  // 브리핑 아래·옆의 다른 화면 바로가기 (현재 기간의 기사 수와 함께)
  function goButtons(inline) {
    const list = periodItems(), gov = list.filter(it => isMohw(it.r)).length;
    const b = (v, ic, label, n) => inline
      ? `<button type="button" class="btn" data-goview="${v}">${icon(ic)}${label}</button>`
      : `<button type="button" data-goview="${v}">${icon(ic)}<span>${label}</span><small>${PERIOD_LABEL[filter.period]} ${fmt(n)}건</small>${icon('chevron-right')}</button>`;
    return `${inline ? '' : '<div class="ai-go">'}${b('list', 'newspaper', '전체 기사 보기', list.length)}${b('cats', 'columns-3', '분류별로 보기', list.length)}${b('gov', 'landmark', '국고사업 보기', gov)}${inline ? '' : '</div>'}`;
  }

  // AI 브리핑: GitHub Actions 가 정리해 둔 brief.json (오늘 새 기사 · 최근 7일 · 최근 30일)
  const AI_KINDS = { daily: '오늘', weekly: '주간', monthly: '월간' };
  const aiOf = k => k === 'daily' ? brief.days[briefAt] : brief[k];
  function renderAi() {
    const kinds = Object.keys(AI_KINDS).filter(k => k === 'daily' ? brief.days.length : brief[k]);
    if (!kinds.length) {
      $('aiBrief').innerHTML = `<section class="card">${empty('아직 AI 브리핑이 없습니다. 매일 아침 기사 분석 후 만들어집니다.', 'sparkles')}<div class="go-only">${goButtons(true)}</div></section>`;
      return;
    }
    const want = { today: 'daily', '7': 'weekly', '30': 'monthly', all: 'monthly' }[filter.period];
    aiKind = kinds.includes(want) ? want : kinds[0];
    const b = aiOf(aiKind);
    const byLink = new Map(items.map(it => [get(it.r, 'link'), it]));
    const d = parseDate(b.date), from = parseDate(b.from), a = daysAgo(d);
    const md = x => `${x.getMonth() + 1}월 ${x.getDate()}일`;
    const span = aiKind === 'daily'
      ? `${from && d && b.from !== b.date ? `${md(from)} ~ ${md(d)} ${WEEK[d.getDay()]}` : d ? `${md(d)} ${WEEK[d.getDay()]}` : esc(b.date)}${a === 0 ? ' (오늘)' : a === 1 ? ' (어제)' : ''} · 기사 ${fmt(b.count || 0)}건`
      : `${from && d ? `${md(from)} ~ ${md(d)}` : ''} · 기사 ${fmt(b.count || 0)}건`;
    const refName = it => {
      const who = get(it.r, 'source').replace(/\(.*?\)/g, '');
      return `<span class="src">${esc(who || '기사')}</span><span class="t">${esc(titleOf(it))}</span>`;
    };
    const SHOW = 3;  // 동향 하나에 근거 기사 버튼은 4개까지 (나머지는 패널에서 ←/→ 로 넘겨 봄)
    // 동향을 '정책 방향' / '병원 현장'으로 나눠 보여 줌 (주간·월간은 정책 먼저)
    const SEC = { 정책: '정책 방향', 병원: '병원 현장' };
    const order = aiKind === 'daily' ? ['병원', '정책'] : ['정책', '병원'];
    const points = (b.points || []).map((p, k) => ({ ...p, k }));
    const hasSec = points.some(p => p.section);
    const item = p => {
      const k = p.k, refs = (p.links || []).map(l => byLink.get(l)).filter(Boolean);
      ctxs['ai:' + k] = refs;
      return `<li><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>
        ${refs.length ? `<div class="ai-refs">${refs.map((it, i) =>
          `<button type="button" class="ai-ref${i >= SHOW ? ' extra' : ''}" data-ctx="ai:${k}" data-i="${i}" title="${esc(titleOf(it))}">${refName(it)}</button>`).join('')}${
          refs.length > SHOW ? `<button type="button" class="ai-more" data-more data-tip="${esc(refs.slice(SHOW).map(it => '· ' + titleOf(it)).join(String.fromCharCode(10)))}">외 ${fmt(refs.length - SHOW)}건 더 보기${icon('chevron-down')}</button>` : ''}</div>` : ''}</li>`;
    };
    const pts = hasSec
      ? order.map(sec => [sec, points.filter(p => (p.section || '병원') === sec)]).filter(([, arr]) => arr.length)
          .map(([sec, arr]) => `<div class="ai-sec"><h4 class="ai-sec-name">${icon(sec === '정책' ? 'landmark' : 'hospital')}${SEC[sec]}</h4><ol class="ai-points">${arr.map(item).join('')}</ol></div>`).join('')
      : `<ol class="ai-points">${points.map(item).join('')}</ol>`;
    const imp = b.implications || [];
    const nav = aiKind === 'daily' && brief.days.length > 1 ? `<div class="ai-nav">
        <button class="icon-btn" type="button" data-ai="1" ${briefAt >= brief.days.length - 1 ? 'disabled' : ''} aria-label="이전 날 브리핑">${icon('chevron-left')}</button>
        <button class="icon-btn" type="button" data-ai="-1" ${briefAt === 0 ? 'disabled' : ''} aria-label="다음 날 브리핑">${icon('chevron-right')}</button>
      </div>` : '';
    $('aiBrief').innerHTML = `<section class="card ai" aria-label="AI 브리핑">
      <div class="ai-head">
        <div class="ai-label"><span class="ai-mark">${icon('sparkles')}</span>AI ${AI_KINDS[aiKind]} 브리핑<small>${span}</small></div>
        <div class="ai-tools">${nav}</div>
      </div>
      <div class="ai-body">
        <div class="ai-main">
          ${b.headline ? `<p class="ai-headline">${esc(b.headline)}</p>` : ''}
          ${pts}
        </div>
        <aside class="ai-side">
          <div class="ai-side-in">
          <h3>${icon('lightbulb')}우리 병원 시사점</h3>
          ${imp.length ? `<ul>${imp.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="ai-note" style="margin:0">이번 브리핑에는 시사점이 없습니다.</p>'}
          <p class="ai-note">${/claude/i.test(b.model || '') ? 'Claude' : 'Gemini'}가 선별 기사 요약을 바탕으로 작성했습니다${b.generatedAt ? ` (${esc(b.generatedAt)})` : ''}. 판단 전에 근거 기사를 확인해 주세요.</p>
          ${goButtons()}
          </div>
        </aside>
      </div>
    </section>`;
  }

  /* ---------- 화면 2: 분류별 보기 ---------- */
  function renderCats(list) {
    const groups = byCategory(list);
    $('ccols').innerHTML = groups.length ? groups.map(([cat, arr]) => {
      ctxs['c:' + cat] = arr;
      const share = list.length ? Math.round(arr.length / list.length * 100) : 0;
      return `<section class="card ccol">
        <button type="button" class="ccol-name" data-gocat="${esc(cat)}">${esc(cat)}${icon('chevron-right')}</button>
        <div class="ccol-num"><b>${fmt(arr.length)}</b>건 · 전체의 ${share}%</div>
        <div class="share" data-tip="${esc(cat)} · 전체 기사의 ${share}%"><span style="width:${share}%"></span></div>
        <div class="ccol-list">${arr.map((it, i) => piTitle(it, 'c:' + cat, i)).join('')}</div>
      </section>`;
    }).join('') : `<div class="card">${empty('이 기간에 등록된 기사가 없습니다')}</div>`;

    const bars = (rows, kind) => rows.length ? kwBarsHtml(rows) : empty(kind === 'kw' ? '표시할 키워드가 없습니다' : '출처 정보가 없습니다');
    $('kwBars').innerHTML = bars(countBy(list, keywordsOf).slice(0, 10), 'kw');
    $('srcBars').innerHTML = bars(countBy(list, it => get(it.r, 'source') ? [get(it.r, 'source')] : []).slice(0, 8), 'src');
    renderTrend();
  }

  // 일자별 기사 수 (기간이 짧아도 흐름이 보이도록 최소 14일)
  function renderTrend() {
    const days = filter.period === '30' || filter.period === 'all' ? 30 : 14;
    const base = today0(), count = new Map();
    items.forEach(it => { const a = daysAgo(it.date); if (a >= 0 && a < days) count.set(a, (count.get(a) || 0) + 1); });
    const series = [...Array(days)].map((_, k) => {
      const d = new Date(base); d.setDate(d.getDate() - (days - 1 - k));
      return { d, n: count.get(days - 1 - k) || 0 };
    });
    const peak = Math.max(0, ...series.map(s => s.n));
    const yMax = peak <= 4 ? 4 : Math.ceil(peak / 2) * 2;
    const step = days > 14 ? 7 : 3;
    $('trendSub').textContent = `최근 ${days}일`;
    $('trend').innerHTML = `<div class="trend">
        ${[0, .5, 1].map(f => `<div class="gl" style="bottom:${f * 100}%"><span>${yMax * f}</span></div>`).join('')}
        <div class="tcols">${series.map(s => `<div class="tcol" data-tip="${s.d.getMonth() + 1}월 ${s.d.getDate()}일 · ${s.n}건">
          <span style="height:${(s.n / yMax * 100).toFixed(1)}%"></span></div>`).join('')}</div>
      </div>
      <div class="tx">${series.map((s, k) => `<span>${(days - 1 - k) % step === 0 ? shortDate(s.d) : ''}</span>`).join('')}</div>`;
  }

  /* ---------- 화면 3: 전체 기사 ---------- */
  const scopeItems = () => view === 'gov'
    ? (openOnly ? items.filter(it => isMohw(it.r) && dlOf(it)?.open) : periodItems().filter(it => isMohw(it.r)))
    : periodItems();
  function renderTabs() {
    const base = scopeItems();
    const list = [['전체', base.length], ...byCategory(base).map(([g, arr]) => [g, arr.length])];
    if (filter.cat !== '전체' && !list.some(([g]) => g === filter.cat)) list.push([filter.cat, 0]);
    $('tabs').setAttribute('aria-label', groupLabel());
    $('tabs').innerHTML = list.length < 2 ? '' : list.map(([c, n]) =>
      `<button type="button" role="tab" aria-selected="${c === filter.cat}" class="tab${c === filter.cat ? ' on' : ''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${fmt(n)}</span></button>`
    ).join('');
  }

  // 목록형 카드(관리자 페이지와 같은 짜임): 사진 없이 메타·제목·요약, 오른쪽에 원문. 카드를 누르면 요약 패널. 같은 사건의 다른 기사는 아래에 묶음
  function card(it, i, rel = [], idx) {
    const r = it.r, src = get(r, 'source'), sum = plain(summaryOf(r)), link = get(r, 'link');
    const ok = /^https?:\/\//i.test(link), rv = isReview(r);
    const meta = [
      (dl => dl ? `<span class="dl ${dl.kind}">${icon(dl.open ? 'clock' : 'calendar')}${dl.text}</span>` : '')(dlOf(it)),
      rv ? `<span class="review">${icon('circle-help')}검토필요</span>` : '',
      ...cats(r).slice(0, 1).map(c => `<span class="m cat">${esc(c)}</span>`),
      src ? `<span class="m">${hl(src)}</span>` : '',
      it.date ? `<span class="m">${shortDate(it.date)}</span>` : '',
    ].join('');
    const relHtml = rel.length ? `<div class="rel"><span class="rel-h">같은 소식 ${fmt(rel.length)}건 더</span>${rel.slice(0, 3).map(x =>
      `<button type="button" data-ctx="list" data-i="${idx.get(x)}"><b>${esc(get(x.r, 'source').replace(/\(.*?\)/g, ''))}</b>${esc(titleOf(x))}</button>`).join('')}</div>` : '';
    return `<article class="news${rv ? ' is-review' : ''}${readSet.has(it.id) ? ' read' : ''}" data-ctx="list" data-i="${i}" data-id="${it.id}" tabindex="0" aria-label="${esc(titleOf(it))} 요약 보기">
      <div class="news-body">
        <div class="meta">${isNew(it) ? '<span class="new">NEW</span>' : ''}${meta}</div>
        <h3 class="title"><span>${hl(titleOf(it))}</span></h3>
        ${sum ? `<p class="summary">${hl(sum)}</p>` : ''}
        ${relHtml ? `<div class="news-foot">${relHtml}</div>` : ''}
      </div>
      <div class="news-side">
        ${ok ? `<a class="orig" href="${esc(link)}" rel="noopener" data-open="${it.id}">원문${icon('arrow-up-right')}</a>` : ''}
      </div>
    </article>`;
  }

  // 같은 사건을 다룬 기사 묶기: 제목 글자쌍이 많이 겹치고(출처가 다르면 50%, 같으면 95% 이상) 보도일이 3일 안
  const bigrams = t => { const x = t.replace(/\[[^\]]*\]|\([^)]*\)|[^0-9A-Za-z가-힣]/g, ''); const S = new Set(); for (let k = 0; k < x.length - 1; k++) S.add(x.slice(k, k + 2)); return S; };
  function clusters(list) {
    const bg = list.map(it => bigrams(titleOf(it))), used = new Set(), out = [];
    const t = it => (it.date ? it.date.getTime() : 0);
    for (let a = 0; a < list.length; a++) {
      if (used.has(a)) continue;
      const rel = [];
      for (let b = a + 1; b < list.length; b++) {
        if (t(list[a]) - t(list[b]) > 3 * 864e5) break;
        if (used.has(b) || !bg[a].size || !bg[b].size) continue;
        let n = 0; for (const x of bg[a]) if (bg[b].has(x)) n++;
        const ov = n / Math.min(bg[a].size, bg[b].size);
        const sa = get(list[a].r, 'source'), sb = get(list[b].r, 'source');
        if (ov >= 0.95 || (sa !== sb && ov >= 0.5)) { rel.push(list[b]); used.add(b); }
      }
      out.push({ it: list[a], rel });
    }
    return out;
  }

  function renderList() {
    const q = filter.q.toLowerCase();
    const tops = topNames(scopeItems());
    listItems = scopeItems().filter(it =>
      (filter.cat === '전체' || inGroup(it, filter.cat, tops)) && (!q || it.text.includes(q)));
    ctxs.list = listItems;
    const active = filter.q || filter.cat !== '전체';
    const desc = [PERIOD_LABEL[filter.period], filter.cat !== '전체' ? esc(filter.cat) : '', filter.q ? `"${esc(filter.q)}"` : ''].filter(Boolean).join(' · ');
    $('result').innerHTML = `<span>${desc} <b>${fmt(listItems.length)}건</b></span>
      ${active ? `<button type="button" class="link-btn" data-act="reset">${icon('rotate-ccw')}필터 초기화</button>` : ''}`;

    if (!listItems.length) {
      $('newsList').innerHTML = items.length && view === 'gov' && !scopeItems().length
        ? `<div class="state">${icon('landmark')}<h3>${PERIOD_LABEL[filter.period]} 보건복지부 자료가 없습니다</h3>
            <p>기간을 넓혀 보거나, 출처·기관 열에 '보건복지부'가 들어간 자료가 있는지 확인해 주세요.</p>
            <button class="btn" type="button" data-act="reset-all">${icon('rotate-ccw')}전체 기간으로 보기</button></div>`
        : items.length
        ? `<div class="state">${icon('search-x')}<h3>조건에 맞는 기사가 없습니다</h3>
            <p>검색어를 바꾸거나 기간·분류를 넓혀 보세요.</p>
            <button class="btn" type="button" data-act="reset-all">${icon('rotate-ccw')}전체 기간·전체 분류로 보기</button></div>`
        : `<div class="state">${icon('inbox')}<h3>아직 등록된 동향이 없습니다</h3>
            <p>구글 시트 2행부터 입력하면 30분 안에 이곳에 표시됩니다.</p></div>`;
      return;
    }
    const groupsC = clusters(listItems), idx = new Map(listItems.map((it, i) => [it, i]));
    const groupCount = new Map();
    groupsC.forEach(({ it }) => { const k = dayKey(it.date); groupCount.set(k, (groupCount.get(k) || 0) + 1); });
    let html = '', prev = null;
    groupsC.slice(0, shown).forEach(({ it, rel }) => {
      const k = dayKey(it.date);
      if (k !== prev) {
        const a = daysAgo(it.date);
        const rel = a === 0 ? '오늘' : a === 1 ? '어제' : '';
        const label = it.date ? `${it.date.getMonth() + 1}월 ${it.date.getDate()}일 ${WEEK[it.date.getDay()]}` : '날짜 미상';
        html += `<h2 class="day">${label}${rel ? `<span class="rel">${rel}</span>` : ''}<span class="cnt">${fmt(groupCount.get(k))}건</span></h2>`;
        prev = k;
      }
      html += card(it, idx.get(it), rel, idx);
    });
    if (groupsC.length > shown) {
      html += `<button type="button" class="btn more" data-act="more">${icon('chevrons-down')}더 보기 (${fmt(groupsC.length - shown)}건 남음)</button>`;
    }
    $('newsList').innerHTML = html;
  }

  /* ---------- 전체 렌더 ---------- */
  function renderAll() {
    const list = periodItems();
    const today = items.filter(isNew).length;
    $('vTitle').textContent = VIEWS[view].title;
    $('vDesc').innerHTML = !items.length ? '아직 등록된 동향이 없습니다. 구글 시트 2행부터 입력하면 30분 안에 표시됩니다.'
      : view === 'gov' ? `${PERIOD_LABEL[filter.period]} 보건복지부 자료 <b>${fmt(list.filter(it => isMohw(it.r)).length)}건</b> · 기사를 누르면 요약, 원문 버튼을 누르면 원문으로 이동합니다`
      : view === 'list' ? `${PERIOD_LABEL[filter.period]} 기사 <b>${fmt(list.length)}건</b> · 기사를 누르면 요약, 원문 버튼을 누르면 원문으로 이동합니다`
      : `${PERIOD_LABEL[filter.period]} 기사 <b>${fmt(list.length)}건</b> · 공개 기사 전체 <b>${fmt(items.length)}건</b>${today && today < items.length / 2 ? ` · 오늘 새로 들어온 기사 <b>${fmt(today)}건</b>` : ''}`;
    document.querySelectorAll('#period button').forEach(b => b.classList.toggle('on', b.dataset.period === filter.period));
    document.querySelectorAll('#vtabs button').forEach(b => {
      const on = b.dataset.view === view;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on);
    });
    ['brief', 'cats', 'list'].forEach(v => { $('v-' + v).hidden = v !== (view === 'gov' ? 'list' : view); });
    $('govIntro').hidden = view !== 'gov';
    if (view === 'gov') {
      const open = items.filter(it => isMohw(it.r) && dlOf(it)?.open).length;
      $('govMsg').innerHTML = `보건복지부 보도자료·사업 공고 모음 · 지금 <b>접수 중인 공고 ${fmt(open)}건</b>${openOnly ? ' (기간과 관계없이 모두 표시)' : ''}`;
    }
    ctxs = {};
    renderAi();
    renderCats(list);
    renderTabs();
    renderList();
    drawIcons();
  }
  function update() { shown = PAGE; renderAll(); }
  function setView(v, scroll = true) {
    if (!VIEWS[v]) v = 'brief';
    if (v !== view && (v === 'gov' || view === 'gov')) filter.cat = '전체';
    view = v;
    try { history.replaceState(null, '', '#' + v); } catch {}
    renderAll();
    if (scroll) window.scrollTo({ top: 0 });
  }
  // 브리핑·분류 화면에서 누른 키워드/분류로 전체 기사 목록을 걸러 보여 줌
  function goList({ q = '', cat = '전체' }) {
    filter.q = q; filter.cat = cat; $('q').value = q;
    shown = PAGE;
    setView('list');
  }

  /* ---------- 읽기 패널 ---------- */
  function openReader(i, list) {
    const it = list[i]; if (!it) return;
    ctx = list; current = i;
    const r = it.r, link = get(r, 'link'), src = get(r, 'source'), summary = summaryOf(r), judge = judgeOf(r);
    const ex = extras(r), kw = cols.keywords !== undefined ? splitList(get(r, 'keywords')) : [];
    $('reader').innerHTML = `
      <div class="meta">${isNew(it) ? '<span class="new">NEW</span>' : ''}${cats(r).map(c => `<span class="m cat">${esc(c)}</span>`).join('')}${src ? `<span class="m">${hl(src)}</span>` : ''}</div>
      <h2 class="r-title" id="rTitle">${hl(titleOf(it))}</h2>
      <div class="r-date">${icon('calendar')}${fullDate(it.date)}${judge ? ` <span style="margin-left:10px">${icon('sparkles')}AI 판정 · ${esc(judge)}</span>` : ''}</div>
      <hr class="r-rule">
      ${summary ? `<div class="prose">${prose(summary)}</div>` : '<p class="prose" style="color:var(--muted)">요약이 없는 기사입니다. 원문에서 확인해 주세요.</p>'}
      ${kw.length ? `<div class="kw">${kw.map(k => `<span>#${esc(k)}</span>`).join('')}</div>` : ''}
      ${ex.length ? `<dl class="fields">${ex.map(e => `<div><dt>${esc(e.h)}</dt><dd>${hl(e.v)}</dd></div>`).join('')}</dl>` : ''}
      ${/^https?:\/\//i.test(link) ? `<a class="cta" href="${esc(link)}" rel="noopener">원문 기사 읽기${icon('arrow-up-right')}</a>
        <a class="r-fb" href="feedback.html?link=${encodeURIComponent(link)}&title=${encodeURIComponent(titleOf(it))}" target="_self">${icon('message-square-warning')}분류가 잘못됐거나 의견이 있으면 남겨 주세요</a>` : ''}
      <div class="hint"><kbd>←</kbd> <kbd>→</kbd> 이전·다음 기사 &nbsp; <kbd>Esc</kbd> 닫기</div>`;
    $('pos').textContent = `${i + 1} / ${list.length}`;
    $('prev').disabled = i === 0;
    $('next').disabled = i >= list.length - 1;
    $('reader').scrollTop = 0;
    drawIcons();
    markRead(it.id);
    if (!document.body.classList.contains('reading')) {
      lastFocus = document.activeElement;
      document.body.classList.add('reading', 'locked');
      $('reader').focus({ preventScroll: true });
    }
  }
  function closeReader() {
    if (current < 0) return;
    document.body.classList.remove('reading', 'locked');
    current = -1;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  function step(d) {
    const n = current + d;
    if (n < 0 || n >= ctx.length) return;
    if (ctx === listItems && n >= shown) { shown += PAGE; renderList(); drawIcons(); }
    openReader(n, ctx);
    if (ctx === listItems) {
      const el = document.querySelector(`.news[data-i="${n}"]`);
      if (el) { el.scrollIntoView({ block: 'center' }); lastFocus = el; }
    }
  }

  /* ---------- 툴팁 ---------- */
  const tip = $('tip');
  function showTip(el) {
    const r = el.getBoundingClientRect();
    tip.textContent = el.dataset.tip;
    tip.style.left = `${Math.min(Math.max(r.left + r.width / 2, 80), innerWidth - 80)}px`;
    tip.style.top = `${r.top}px`;
    tip.classList.add('show');
  }
  const hideTip = () => tip.classList.remove('show');
  ['mouseover', 'focusin'].forEach(t => document.addEventListener(t, e => { const el = e.target.closest('[data-tip]'); el ? showTip(el) : hideTip(); }));
  ['mouseout', 'focusout'].forEach(t => document.addEventListener(t, e => { if (e.target.closest('[data-tip]')) hideTip(); }));
  window.addEventListener('scroll', hideTip, { passive: true });

  /* ---------- 이벤트 ---------- */
  let timer;
  $('q').addEventListener('input', e => { clearTimeout(timer); timer = setTimeout(() => { filter.q = e.target.value.trim(); update(); }, 200); });
  $('q').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; filter.q = ''; update(); } });
  $('vtabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setView(b.dataset.view); });
  $('period').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { filter.period = b.dataset.period; update(); } });
  $('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) { filter.cat = b.dataset.cat; update(); } });
  $('openOnly').addEventListener('change', e => { openOnly = e.target.checked; update(); });
  $('overlay').addEventListener('click', closeReader);
  $('close').addEventListener('click', closeReader);
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  document.addEventListener('click', e => {
    const t = e.target;
    let el;
    if ((el = t.closest('[data-open]'))) return markRead(el.dataset.open);
    if ((el = t.closest('[data-ctx]'))) return openReader(+el.dataset.i, ctxs[el.dataset.ctx] || []);
    if ((el = t.closest('[data-ai]'))) { briefAt += +el.dataset.ai; renderAi(); drawIcons(); return; }
    if ((el = t.closest('[data-word]'))) return goList({ q: filter.q === el.dataset.word && view === 'list' ? '' : el.dataset.word });
    if ((el = t.closest('.bar-row'))) return goList({ q: el.dataset.q });
    if ((el = t.closest('[data-gocat]'))) return goList({ cat: el.dataset.gocat });
    if ((el = t.closest('[data-goview]'))) return setView(el.dataset.goview);
    if ((el = t.closest('[data-more]'))) { hideTip(); el.closest('.ai-refs').classList.add('open'); return; }
    if ((el = t.closest('[data-act]'))) {
      const act = el.dataset.act;
      if (act === 'reset') { filter.q = ''; filter.cat = '전체'; $('q').value = ''; update(); }
      else if (act === 'reset-all') { filter = { q: '', cat: '전체', period: 'all' }; $('q').value = ''; update(); }
      else if (act === 'more') { shown += PAGE; renderList(); drawIcons(); }
    }
  });
  document.addEventListener('keydown', e => {
    if (document.body.classList.contains('reading')) {
      if (e.key === 'Escape') closeReader();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key === 'Tab') {  // 패널 안에서만 포커스 이동
        const f = [...$('sheet').querySelectorAll('button:not(:disabled), a[href]')];
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
      return;
    }
    if (e.key === '/' && (view === 'list' || view === 'gov') && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Enter' && e.target.matches && e.target.matches('article.news[data-ctx]')) openReader(+e.target.dataset.i, ctxs.list || []);
  });
  const syncTopbar = () => document.documentElement.style.setProperty('--tb-h', $('topbar').offsetHeight + 'px');
  let rt;
  window.addEventListener('resize', () => { syncTopbar(); });
  window.addEventListener('scroll', () => {
    $('toolbar').classList.toggle('stuck', (view === 'list' || view === 'gov') && $('toolbar').getBoundingClientRect().top <= $('topbar').offsetHeight);
  }, { passive: true });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== view) setView(v); });

  // 미리보기 전용 예시 데이터 (실제 배포 시에는 사용되지 않음)
  const DEMO = (() => {
    const d = n => { const t = new Date(); t.setDate(t.getDate() - n); return dayKey(t); };
    const now = new Date();
    const S = ['예시신문', '예시일보', '예시뉴스', '예시저널', '예시메디칼'];
    const row = (n, cat, title, k, summary = '', st = '선별(필요)') => [d(n), cat, '[예시] ' + title, S[k % 5], 'https://example.com',
      summary || `${title}에 대한 예시 요약입니다. 실제 시트의 요약 열 내용이 이 자리에 표시됩니다.`, st, '자료수집'];
    return {
      title: '의료계 동향',
      fetchedAt: `${dayKey(now)} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
      headers: ['수집일', '분류', '제목', '출처', '링크', 'AI 요약', '선별결과', '진행상황'],
      rows: [
        row(0, '정책', '필수의료 수가 개선안 공청회 개최', 0,
          '예시 요약 첫 문단입니다.\n- 도입 배경: **굵게 표시**도 지원합니다\n- 기술 사양\n- 임상·환자 편익\n마지막 문단은 이렇게 따로 표시됩니다.'),
        row(0, '의료기기', '디지털 의료기기 신의료기술 평가 유예 확대 검토', 1),
        row(0, 'AI·디지털', '의료 AI 판독 보조 소프트웨어 건강보험 적용 논의', 2, '', '검토필요'),
        row(0, 'AI·디지털', '같은 소식을 다룬 다른 매체 기사 (제외 처리되어 보이지 않음)', 3, '', '제외(중복)'),
        row(1, '병원경영', '상급종합병원 구조전환 2차 참여 병원 발표', 3),
        row(1, '인력', '전공의 수련환경 개선 협의체 첫 회의', 4),
        row(1, '정책', '비대면진료 제도화 법안 상임위 통과', 0),
        row(2, 'AI·디지털', '비대면진료 플랫폼 이용 현황 분석', 2, '', '검토필요'),
        row(2, '의료기기', '혁신의료기기 통합심사 대상 품목 추가', 1),
        row(3, '정책', '건강보험 재정 전망과 수가 협상 일정', 0),
        row(3, '인력', '의대 정원 조정 관련 의료계 입장', 4),
        row(4, '병원경영', '지역 필수의료 병원 지원 사업 공모', 3),
        row(5, 'AI·디지털', '의료 AI 가이드라인 개정안 공개', 2),
        row(6, '정책, 인력', '필수의료 인력 확보 대책', 0),
        row(8, '의료기기', '의료기기 인허가 절차 간소화', 1),
        row(12, '병원경영', '상급종합병원 중환자실 운영 현황', 3),
        row(40, '정책', '40일 전 정책 동향', 0),
        [d(0), '정책', '[예시] 지역 필수의료 강화 국고보조사업 공모 안내', '보건복지부', 'https://www.mohw.go.kr',
          '보건복지부 자료 예시입니다. 국고사업 탭에는 출처가 보건복지부인 자료만 모입니다.\n- 사업 목적\n- 지원 규모\n- 신청 기간', '선별(필요)', '자료수집'],
        [d(2), '정책', '[예시] 응급의료 전달체계 개선 시범사업 참여기관 모집', '보건복지부', 'https://www.mohw.go.kr', '보건복지부 시범사업 공모 예시입니다.', '선별(필요)', '자료수집'],
        [d(5), '정책', '[예시] 의료기관 디지털 전환 지원사업 결과 발표', '보건복지부', 'https://www.mohw.go.kr', '보건복지부 사업 결과 예시입니다.', '검토필요', '자료수집'],
      ],
    };
  })();

  // 미리보기 전용 AI 브리핑 예시
  const DEMO_BRIEF = (() => {
    const ago = n => { const t = new Date(); t.setDate(t.getDate() - n); return dayKey(t); };
    const one = (n, from, count, headline) => ({
      date: ago(n), from: ago(from), count, generatedAt: ago(n) + ' 09:42', model: 'demo', headline,
      points: [
        { section: '정책', title: '[예시] 필수의료 수가 개선 공청회', body: '예시 문장입니다. 아래 근거 기사를 누르면 요약 패널이 열림.', links: ['https://example.com'] },
        { section: '정책', title: '[예시] 의료 AI 건강보험 적용 논의', body: '판독 보조 소프트웨어 급여 기준 마련 논의 예정.', links: [] },
        { section: '병원', title: '[예시] 상급종합병원 구조전환 2차 발표', body: '참여 병원 명단 공개 및 후속 지원 추진.', links: [] },
      ],
      implications: ['[예시] 우리 병원이 검토할 만한 점이 이 자리에 표시됩니다.', '[예시] 기사 근거가 분명한 것만 작성됩니다.'],
    });
    return {
      days: [one(0, 0, 6, '[예시] 오늘 새 기사 한 줄 요약'), one(1, 1, 4, '[예시] 어제 브리핑 한 줄 요약')],
      weekly: one(0, 6, 15, '[예시] 최근 7일 흐름 한 줄 요약'),
      monthly: one(0, 29, 20, '[예시] 최근 30일 흐름 한 줄 요약'),
    };
  })();

  syncTopbar();
  const startView = location.hash.slice(1);
  view = VIEWS[startView] ? startView : 'brief';
  drawIcons();
  load();
</script>
